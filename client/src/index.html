<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GanjaCraft Launcher</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>GanjaCraft</h2>
        
        <!-- Шаг 1: Ввод ника -->
        <div id="step-1">
            <input type="text" id="username" placeholder="Ваш никнейм">
            <button id="btn-get-code">Получить код</button>
        </div>

        <!-- Шаг 2: Ввод кода -->
        <div id="step-2" class="hidden">
            <p>Код отправлен в Telegram!</p>
            <input type="text" id="auth-code" placeholder="Код из бота">
            <button id="btn-verify">Войти</button>
        </div>

        <!-- Шаг 3: Запуск -->
        <div id="step-3" class="hidden">
            <h3 id="welcome-msg">Привет!</h3>
            <button id="btn-launch">ИГРАТЬ</button>
            <div id="console-output" style="
                margin-top: 20px;
                background: #000;
                color: #0f0;
                font-family: monospace;
                font-size: 12px;
                height: 150px;
                overflow-y: auto;
                text-align: left;
                padding: 10px;
                border-radius: 5px;
                display: none;
            "></div>
        </div>

        <div id="status"></div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
