<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GanjaCraft Launcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Custom Title Bar -->
    <div id="title-bar">
        <div id="title-bar-title">GANJACRAFT LAUNCHER</div>
        <div id="window-controls">
            <button id="btn-minimize" class="control-btn" title="Minimize"></button>
            <button id="btn-close" class="control-btn" title="Close"></button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div id="bg-overlay"></div>

        <div class="auth-container fade-in">
            <h2>GanjaCraft</h2>
            
            <!-- Step 1: Login -->
            <div id="step-login">
                <input type="text" id="username" placeholder="Username" spellcheck="false">
                <button id="login-btn">Next</button>
            </div>

            <!-- Step 2: Code Verification -->
            <div id="step-code" class="hidden">
                <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Code sent to Telegram</p>
                <input type="text" id="auth-code" placeholder="Enter Code" spellcheck="false">
                <button id="verify-btn">Play</button>
            </div>

            <!-- Step 3: Progress -->
            <div id="step-progress" class="hidden">
                <div id="status">Initializing...</div>
                <div style="width: 100%; background: #333; height: 6px; border-radius: 3px; margin-top: 10px; overflow: hidden;">
                    <div id="progress-bar" style="width: 0%; height: 100%; background: #4CAF50; transition: width 0.2s;"></div>
                </div>
                <button id="cancel-btn" style="background: #d32f2f; margin-top: 20px; font-size: 12px; padding: 8px;">Cancel</button>
            </div>

            <!-- Console Toggle -->
            <div style="margin-top: 15px; text-align: right;">
                <a href="#" id="toggle-console" style="color: #666; font-size: 10px; text-decoration: none;">Toggle Console</a>
            </div>
            
            <!-- Console Output -->
            <div id="console-output"></div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
